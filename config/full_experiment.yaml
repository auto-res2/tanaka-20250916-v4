experiment:
  name: "h2d_gat_full_experiment"
  epochs: 400
  batch_size: 260000
  
model:
  num_layers: 2
  hidden_dim: 256
  num_heads: 8
  keep_rate_init: 0.2
  window_size: 16
  rank: 6
  group_size: 6

dataset:
  name: "ogbn-products"
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2

training:
  lr: 0.001
  weight_decay: 5e-4
  patience: 100
  scheduler: "cosine"
  warmup_epochs: 20

ablation:
  test_variants: ["full", "no_group_dpp", "no_hierarchical", "no_4bit", "no_rl", "no_inference_reuse"]
  keep_rates: [0.05, 0.1, 0.2, 0.4, 1.0]
  quantization_bits: [4, 8, 16]
